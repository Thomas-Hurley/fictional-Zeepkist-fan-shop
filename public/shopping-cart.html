<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZFS | Shopping cart</title>
    <script defer src="scripts/user-scripts/shopping-cart-script.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <nav class="flex justify-between w-full bg-pink-300 p-3">
            <img class="w-10 h-7 md:w-18 md:h-auto" src="images/zeepkist-logo.png" alt="logo">
            <h1 class="font-mono text-xl md:text-3xl font-bold">Zeepkist fan shop</h1>
            <button id="shoppingCartButton" class="hover:cursor-pointer hover:outline-3 hover:outline-black bg-white rounded-full p-2">
                <img class="w-4 h-auto md:w-8" src="images/index-images/shopping-cart.png" alt="shopping-cart">
                <div class="rounded-full absolute right-2 top-2 bg-red-500 w-4 h-4">
                    <p id="shoppingCartAmount" class="text-white text-xs"></p>
                </div>
            </button>
        </nav>
    </header>

    <div class="min-h-screen grid grid-cols-6">
        <div class="bg-linear-to-b from-pink-300 to-orange-400 h-full col-span-2 md:col-span-1 text-center p-5 font-mono">
            <button id="backToShoppingButton"
                class="text-xs md:text-lg font-mono font-bold hover:cursor-pointer bg-orange-300 outline outline-3 outline-black rounded-md p-2">
                ← Back to shopping</button>
        </div>

        <div class="col-span-4 md:col-span-5 w-full bg-[url(../images/background.png)] bg-bottom bg-no-repeat bg-cover bg-50/100 p-10">
            <h1 class="text-center text-5xl font-bold font-mono">Shopping Cart</h1>
            <div class="w-full flex grid grid-cols-3 gap-8 mt-8">
                <div id="productSection" class="p-6 divide-y divide-dashed divide-y-1 divide-gray-400 col-span-2 px-8 bg-white rounded-lg shadow-lg shadow-gray-500 font-mono">

                </div>
                <div id="recieptSection" class="col-span-1 p-6 bg-white rounded-lg shadow-lg shadow-gray-500 font-mono">
                    <h1 class="text-center text-3xl font-bold mb-5">Items</h1>
                    <div id="productList">

                    </div>
                    <div class="flex justify-between border-t border-dashed border-gray-400 mt-3 pt-3">
                        <h1 class="text-xl font-bold">Total price</h1>
                        <p id="totalPriceHolder" class="text-xl text-end font-bold">-</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer class="flex justify-between bg-orange-400 p-5">
        <div>
            <p class="font-mono">email: example@email.com</p>
            <p class="font-mono">phone: 06-12345678</p>
            <p class="font-mono">location: Street 12 City</p>
        </div>
        <div>
            <h1 class="font-mono text-lg font-bold">Zeepkist Hub:</h1>
            <a href="https://zeepki.st/" target="_blank" class="text-blue-600 underline font-bold">Click here!</a>
        </div>

    </footer>
</body>

</html>
