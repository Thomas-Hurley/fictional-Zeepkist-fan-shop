<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZFS | Shopping page</title>
    <script defer src="scripts/user-scripts/index-script.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<header>
    <nav class="flex justify-between w-full bg-pink-300 p-3">
        <img class="w-10 h-7 md:w-18 md:h-auto" src="images/zeepkist-logo.png" alt="logo">
        <h1 class="font-mono text-xl md:text-3xl font-bold">Zeepkist fan shop</h1>
        <button id="shoppingCartButton"
            class="hover:cursor-pointer hover:outline-3 hover:outline-black bg-white rounded-full p-2">
            <img class="w-4 h-auto md:w-8" src="images/index-images/shopping-cart.png" alt="shopping-cart">
            <div class="rounded-full absolute right-2 top-2 bg-red-500 w-4 h-4">
                <p id="shoppingCartAmount" class="text-white text-xs"></p>
            </div>
        </button>
    </nav>
</header>

<body>
    <div class="grid grid-cols-6">
        <div class="bg-linear-to-b from-pink-300 to-orange-400 h-full col-span-1 text-center p-5 font-mono">
            <h1 class="md:text-2xl text-lg py-5 border-b border-solid border-black font-bold">Hat Types</h1>
            <div class="flex flex-col gap-7 py-3">
                <button id="filter-all" class="hover:text-white hover:cursor-pointer text-xs md:text-lg">All</button>
                <button id="filter-beanies" class="hover:text-white hover:cursor-pointer text-xs md:text-lg">Beanies</button>
                <button id="filter-helmets" class="hover:text-white hover:cursor-pointer text-xs md:text-lg">Racing helmets</button>
                <button id="filter-tophats" class="hover:text-white hover:cursor-pointer text-xs md:text-lg">Top hats</button>
            </div>
        </div>

        <div class="col-span-5 w-full bg-[url(../images/background.png)] bg-bottom bg-no-repeat bg-cover bg-50/100 text-center p-10">
            <div id="productSection" class="grid grid-cols-4 grid-flow gap-8 mt-10 p-10">
                
            </div>
        </div>
        
    </div>

</body>
<footer class="flex justify-between bg-orange-400 p-5">
    <div>
        <p class="font-mono">email: example@email.com</p>
        <p class="font-mono">phone: 06-12345678</p>
        <p class="font-mono">location: Street 12 City</p>
    </div>
    <div>
        <h1 class="font-mono text-lg font-bold">Zeepkist Hub:</h1>
        <a href="https://zeepki.st/" target="_blank" class="text-blue-600 underline font-bold">Click here!</a>
    </div>

</footer>

</html>
